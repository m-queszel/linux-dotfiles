# Idle: lock after 15 min, screen off after 16 min, never suspend. hyprlang, not Lua.
# Runs as the hypridle.service user unit. Apps that inhibit idle (video, games) pause these timers.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock # one instance, however the lock is requested
    before_sleep_cmd = loginctl lock-session # locked before a manual suspend, not after resume
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 960
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
