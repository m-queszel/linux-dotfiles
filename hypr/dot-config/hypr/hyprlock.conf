source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
}

background {
    monitor =
    path = screenshot
    color = $surface
    blur_size = 7
    blur_passes = 3
    brightness = 0.7
    vibrancy = 0.17
}

label {
    monitor =
    text = cmd[update:1000] date +%-I:%M
    color = $on_surface
    font_size = 120
    font_family = Nunito ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %-d"
    color = $on_surface_variant
    font_size = 22
    font_family = Nunito
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    rounding = 14
    outline_thickness = 2
    outer_color = $outline
    inner_color = $pill
    font_color = $on_surface
    font_family = Nunito
    check_color = $tertiary
    fail_color = $error
    capslock_color = $primary
    placeholder_text = <span fgalpha="60%">password</span>
    fail_text = $FAIL
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow
    position = 0, -80
    halign = center
    valign = center
}
