source = ~/.config/hypr/hyprlock-colors.conf

$font = 0xProto Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
}

background {
    monitor =
    path = screenshot
    color = $surface
    blur_size = 7
    blur_passes = 3
    brightness = 0.6
    vibrancy = 0.17
}

shape {
    monitor =
    size = 440, 330
    color = $tertiary
    rounding = 8
    position = 6, -6
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 440, 330
    color = $card
    rounding = 8
    border_size = 2
    border_color = $primary
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] date +%-I:%M
    color = $primary
    font_size = 88
    font_family = $font Bold
    position = -2, 70
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +%-I:%M
    color = $tertiary
    font_size = 88
    font_family = $font Bold
    position = 2, 70
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +%-I:%M
    color = $on_surface
    font_size = 88
    font_family = $font Bold
    position = 0, 70
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %-d"
    color = $on_surface_variant
    font_size = 15
    font_family = $font
    position = 0, -2
    halign = center
    valign = center
    zindex = 3
}

shape {
    monitor =
    size = 360, 48
    color = $tertiary
    rounding = 6
    position = 3, -65
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 360, 48
    rounding = 6
    outline_thickness = 2
    outer_color = $on_surface_variant
    inner_color = $raise
    font_color = $on_surface
    font_family = $font
    check_color = $tertiary
    fail_color = $error
    capslock_color = $primary
    placeholder_text = <span fgalpha="60%">password</span>
    fail_text = $FAIL
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    position = 0, -62
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = 11
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
    zindex = 3
}
