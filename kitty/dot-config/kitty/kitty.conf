# vim:fileencoding=utf-8:foldmethod=marker
# kitty 0.49. Saving this file reloads every kitty window automatically.
# Option reference: /usr/share/doc/kitty/kitty.conf

#: Fonts {{{

font_family      family="0xProto Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14.0
# 0xProto has tall built-in line spacing; tighten it (compared 100/90/85%, 85 still clean)
modify_font cell_height 85%

#: }}}

#: Look {{{

# Translucent like the bar and launcher; Hyprland blurs what's behind (decoration.blur)
background_opacity 0.9
window_padding_width 12
# Hyprland draws the border, corners and shadow
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

#: }}}

#: Cursor {{{

cursor_shape beam
# No blinking: a blinking cursor redraws the window twice a second, forever
cursor_blink_interval 0
# No trail when the cursor jumps
cursor_trail 0

#: }}}

#: Tabs {{{

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"

#: }}}

#: Behavior {{{

scrollback_lines 10000
copy_on_select clipboard
strip_trailing_spaces smart
shell_integration enabled

#: }}}

#: Colors {{{

# Generated from the wallpaper by matugen (`wallpaper <image>`); not tracked in git
include colors.conf

#: }}}
