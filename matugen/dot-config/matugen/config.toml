[config]
# required: without it matugen prompts for a color, and fails when there is no terminal
prefer = "saturation"

[config.custom_colors]
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.lua.tmpl"
output_path = "~/.config/hypr/colors.lua"

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell-colors.json"
output_path = "~/.local/state/theme/colors.json"
post_hook = "setsid -f pixel-art-refresh >/dev/null 2>&1"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook = "pkill -USR1 -x kitty || true"

[templates.ls-colors]
input_path = "~/.config/matugen/templates/ls-colors"
output_path = "~/.config/ls-colors"

[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/starship.toml"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3-colors.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4-colors.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.qt6ct-conf]
input_path = "~/.config/matugen/templates/qt6ct.conf.tmpl"
output_path = "~/.config/qt6ct/qt6ct.conf"

[templates.kde-colorscheme]
input_path = "~/.config/matugen/templates/kde-colors.tmpl"
output_path = "~/.local/share/color-schemes/Matugen.colors"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"
