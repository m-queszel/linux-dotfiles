theme = "rice"
client_id_command = { command = "sh", args = ["-c", "cat \"$HOME/.config/spotify-player/client_id\" 2>/dev/null || echo d420a117a32841c2b3474932e49fb54b"] }
enable_audio_visualization = true
enable_notify = false
ncspot_only_get_endpoints = []
border_type = "Plain"
progress_bar_type = "Line"
playback_format = "{status} {track} • {artists} {liked}\n{album}\n{metadata}"
playback_metadata_fields = ["repeat", "shuffle", "volume"]
cover_img_width = 7

[layout]
playback_window_position = "Top"
playback_window_height = 9
