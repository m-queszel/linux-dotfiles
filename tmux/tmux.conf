setw -g mode-keys vi
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g allow-rename on
set -g renumber-windows on
set -g mouse on
set -g set-titles on
setw -g monitor-activity on
set -g bell-action any
set -g visual-bell off
set -g visual-activity off
set -g focus-events on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -s escape-time 0

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:usstyle:clipboard:sync"
set -s set-clipboard on
set -g allow-passthrough all

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind C-p previous-window
bind C-n next-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

is_vim="#{m/ri:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}"
bind -n C-h if -F "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "$is_vim" "send-keys C-l" "select-pane -R"

bind -r n next-window
bind -r p previous-window
bind -r N swap-window -d -t +1
bind -r P swap-window -d -t -1
bind Space last-window
bind ^ switch-client -l

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind y run-shell -b "tmux save-buffer - | tmux load-buffer -w -" \; display-message "Copied tmux buffer to system clipboard"

set -g pane-border-lines single
set -g pane-border-status off
set -g status-position bottom
set -g status-interval 0

source-file -q ~/.config/tmux/colors.conf

set -g @riso_win "#[range=window|#{window_index}]#[fg=#{@c_on_surface_variant}]    #I #W#{?window_activity_flag,#[fg=#{@c_tertiary}#,bold] •#[nobold],}#{?window_bell_flag,#[fg=#{@c_error}#,bold] !#[nobold],} #[norange]"
set -g @riso_win_on "#[range=window|#{window_index}]#[fg=#{@c_tertiary}] \uF04B #[fg=#{@c_on_primary_container},bg=#{@c_primary_container},bold] #I #W #[fg=#{@c_tertiary},bg=#{@c_bar},nobold]▌ #[norange]"
set -g @riso_left "#[fg=#{@c_on_primary},bg=#{@c_primary},bold] #S #[fg=#{@c_tertiary},bg=#{@c_bar},nobold]▌ #{W:#{E:@riso_win},#{E:@riso_win_on}}"
set -g @riso_pips "#[fg=#{@c_tertiary}]#{R:\uF0C8,#{window_panes}}#[fg=#{@c_outline_variant}]#{?#{e|<:#{window_panes},4},#{R:\uF096,#{e|-:4,#{window_panes}}},} "
set -g @lamp "#[fg=#1a7a1a]\U0010EEEE̅̅\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE\U0010EEEE#[default] "
set -g status-format[0] "#{?@fx_left,#{@fx_left},#{E:@riso_left}}#[align=right]#{E:@riso_pips}#{@lamp}"

set-hook -g session-window-changed "run-shell -b \"python3 -I ~/.config/tmux/fx.py switch '#{session_id}'\""
set-hook -g client-attached "run-shell -b \"python3 -I ~/.config/tmux/fx.py attach '#{session_id}'\""
set-hook -g alert-bell "run-shell -b \"python3 -I ~/.config/tmux/fx.py bell '#{session_id}' '#{window_index}'\""
